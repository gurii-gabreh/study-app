<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study App</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#2d333b;
  --border:#30363d;--border2:#444c56;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --accent:#58a6ff;--accent2:#1f6feb;
  --green:#3fb950;--green-bg:#0d2c1a;--green-border:#2ea043;
  --red:#f85149;--red-bg:#2c1416;--red-border:#da3633;
  --yellow:#d29922;--yellow-bg:#271f0a;--yellow-border:#9e6a03;
  --purple:#bc8cff;--orange:#ffa657;
  --r:8px;--rl:12px;
  /* ホーム画面・ヘッダー用変数（既存変数のエイリアス） */
  --fg:#e6edf3;
  --card:#21262d;
  --muted:#8b949e;
  --blue:#58a6ff;
  --hdr:#161b22;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6;}

/* Header（本体の定義は「ヘッダー改修」ブロック参照。ここでは他クラスのみ定義） */
.logo{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:var(--accent);white-space:nowrap;}
.hdr-tabs{display:flex;gap:4px;margin-left:auto;flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;}
.hdr-tab{padding:5px 14px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;font-family:'Noto Sans JP',sans-serif;}
.hdr-tab:hover{border-color:var(--border2);color:var(--text);}
.hdr-tab.on{background:var(--accent2);border-color:var(--accent);color:#fff;}

/* Layout（56pxは.hdrの実際の高さ。ヘッダー高を変える場合はここも合わせて変更） */
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 56px);}

/* Sidebar */
.side{background:var(--bg2);border-right:1px solid var(--border);padding:12px;overflow-y:auto;max-height:calc(100vh - 56px);position:sticky;top:56px;}
.side-sec{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:4px 8px;margin:8px 0 4px;}
.litem{padding:7px 10px;border-radius:var(--r);cursor:pointer;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;transition:all .15s;border:1px solid transparent;margin-bottom:2px;user-select:none;}
.litem:hover{background:var(--bg3);color:var(--text);}
.litem.on{background:var(--bg3);color:var(--accent);border-color:var(--border);}
.litem .lbadge{font-family:'JetBrains Mono',monospace;font-size:9px;padding:1px 5px;border-radius:3px;background:var(--bg);color:var(--text3);border:1px solid var(--border);flex-shrink:0;}
.litem.on .lbadge{color:var(--accent);border-color:var(--accent2);}
.litem .lscore{margin-left:auto;font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--green);flex-shrink:0;}
.litem .lerr{margin-left:auto;font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--red);flex-shrink:0;}
.add-btn{width:100%;padding:7px;margin-top:6px;border:1px dashed var(--border);background:transparent;color:var(--text3);border-radius:var(--r);cursor:pointer;font-size:12px;transition:all .15s;font-family:'Noto Sans JP',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;}
.add-btn:hover{border-color:var(--accent);color:var(--accent);}
.del-btn{padding:2px 6px;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--text3);font-size:11px;cursor:pointer;margin-left:auto;transition:all .15s;flex-shrink:0;}
.del-btn:hover{border-color:var(--red-border);color:var(--red);}

/* Content */
.content{padding:24px;overflow-y:auto;max-height:calc(100vh - 56px);}

/* Welcome */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:12px;}
.welcome h2{font-size:18px;color:var(--text);}
.welcome p{color:var(--text2);max-width:380px;font-size:13px;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);width:100%;max-width:680px;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto;}
.modal h3{font-size:15px;color:var(--text);}
.ig{display:flex;flex-direction:column;gap:5px;}
.il{font-size:11px;color:var(--text2);}
.tinput{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:12px;font-family:'JetBrains Mono',monospace;resize:vertical;transition:border-color .15s;}
.tinput:focus{outline:none;border-color:var(--accent);}
textarea.tinput{min-height:180px;}
.hint-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);line-height:1.8;white-space:pre-wrap;}
.mact{display:flex;gap:8px;justify-content:flex-end;}
.btn{padding:6px 14px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;font-family:'Noto Sans JP',sans-serif;}
.btn:hover{border-color:var(--border2);color:var(--text);}
.btn-p{background:var(--accent2);border-color:var(--accent);color:#fff;}
.btn-p:hover{opacity:.85;}
.btn-d{border-color:var(--red-border);color:var(--red);}
.btn-d:hover{background:var(--red-bg);}
.btn-y{border-color:var(--yellow-border);color:var(--yellow);}
.btn-y:hover{background:var(--yellow-bg);}

/* Section header */
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.sec-title{font-size:17px;font-weight:600;color:var(--text);}
.course-chip{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 8px;border-radius:4px;background:var(--bg3);color:var(--accent);border:1px solid var(--border);}

/* Sub tabs */
.sub-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:8px;}
.stab{padding:5px 14px;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;font-family:'Noto Sans JP',sans-serif;}
.stab:hover{color:var(--text);}
.stab.on{background:var(--bg3);color:var(--text);border-color:var(--border);}

/* Summary */
.sum-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:18px;white-space:pre-wrap;font-size:13px;line-height:1.9;color:var(--text);margin-bottom:12px;}
.ptable{width:100%;border-collapse:collapse;font-size:12px;}
.ptable th{text-align:left;padding:7px 10px;background:var(--bg3);border-bottom:1px solid var(--border);color:var(--text2);font-weight:500;font-size:11px;}
.ptable td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top;}
.ptable tr:last-child td{border-bottom:none;}
.ptable tr:hover td{background:var(--bg3);}
.copy-row{display:flex;justify-content:flex-end;margin-bottom:8px;}

/* Quiz */
.quiz-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.score-chip{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;color:var(--green);background:var(--green-bg);border:1px solid var(--green-border);border-radius:var(--r);padding:4px 14px;}
.err-chip{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--red);background:var(--red-bg);border:1px solid var(--red-border);border-radius:var(--r);padding:4px 12px;}

.qcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:12px;transition:border-color .2s;}
.qcard.answered-ok{border-color:var(--green-border);}
.qcard.answered-ng{border-color:var(--red-border);}
.qno{font-size:11px;color:var(--text3);margin-bottom:3px;font-family:'JetBrains Mono',monospace;}
.qsrc{font-size:10px;color:var(--text3);font-weight:400;margin-left:8px;font-family:'Noto Sans JP',sans-serif;}
.tbadge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;margin-bottom:6px;}
.t基礎{background:#0d2c1a;color:#3fb950;border:1px solid #2ea043;}
.t意地悪{background:#2c1416;color:#f85149;border:1px solid #da3633;}
.t引っ掛け{background:#271f0a;color:#d29922;border:1px solid #9e6a03;}
.t試験対策{background:#1a1f3a;color:#58a6ff;border:1px solid #1f6feb;}
.qtext{font-size:13px;color:var(--text);line-height:1.7;margin-bottom:10px;font-weight:500;white-space:pre-wrap;}
.qimg-link{display:block;margin-bottom:12px;}
.qimg{max-width:100%;max-height:420px;border-radius:var(--r);border:1px solid var(--border);display:block;background:var(--bg3);}
.qimg-link.qimg-error{display:none;}
.opt{display:block;width:100%;text-align:left;padding:8px 12px;margin-bottom:5px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg3);color:var(--text);font-size:12px;cursor:pointer;transition:all .15s;line-height:1.5;font-family:'Noto Sans JP',sans-serif;white-space:pre-wrap;}
.opt:hover:not(:disabled){background:var(--bg4);border-color:var(--border2);}
.opt.ok{background:var(--green-bg);border-color:var(--green-border);color:var(--green);}
.opt.ng{background:var(--red-bg);border-color:var(--red-border);color:var(--red);}
.opt:disabled{cursor:default;}
.exp{font-size:12px;line-height:1.7;padding:10px 12px;border-radius:var(--r);margin-top:8px;}
.exp-ok{background:var(--green-bg);border:1px solid var(--green-border);color:#7ee787;}
.comment-box{margin:8px 0 4px;padding:10px 12px;background:#161b22;border:1px solid #30363d;border-radius:6px;}
.comment-label{font-size:11px;color:#8b949e;margin-bottom:6px;}
.comment-ta{width:100%;min-height:120px;height:auto;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:8px;font-size:12px;font-family:inherit;resize:vertical;line-height:1.5;overflow-y:visible;white-space:pre-wrap;word-break:break-all;}
.comment-ta:focus{outline:none;border-color:#58a6ff;}
.opt.sel-multi{border-color:#58a6ff;background:#1f3358;color:#79c0ff;}
.multi-submit{cursor:pointer;padding:7px 20px;border:1px solid #388bfd;background:#1f3358;color:#58a6ff;border-radius:6px;font-size:13px;font-weight:600;margin-top:6px;font-family:inherit;}
.multi-submit:hover{background:#263d6a;}
.multi-submit:disabled{opacity:.4;cursor:default;}
.multi-hint{font-size:11px;color:#8b949e;margin-bottom:6px;}
.exp-ng{background:var(--red-bg);border:1px solid var(--red-border);color:#ff7b72;}
.exp-label{font-weight:700;margin-right:4px;}

/* History */
.hist-score{font-family:'JetBrains Mono',monospace;font-size:12px;padding:2px 8px;border-radius:4px;white-space:nowrap;}
.hist-score.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
.hist-score.ng{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);}
.hist-course-sec{margin-bottom:24px;}
.hist-course-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.hist-course-name{font-size:14px;font-weight:700;color:var(--text);}
.hist-count-tabs{display:flex;gap:4px;}
.hist-count-btn{padding:3px 10px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.hist-count-btn:hover{border-color:var(--border2);color:var(--text);}
.hist-count-btn.on{background:var(--accent2);border-color:var(--accent);color:#fff;}
.hist-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);}
.hist-table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap;}
.hist-table th{text-align:center;padding:6px 10px;background:var(--bg3);border-bottom:1px solid var(--border);color:var(--text2);font-weight:500;font-size:11px;}
.hist-table th:nth-child(1),.hist-table th:nth-child(2){text-align:left;}
.hist-table td{padding:6px 10px;border-bottom:1px solid var(--border);color:var(--text);text-align:center;}
.hist-table tr:last-child td{border-bottom:none;}
.hist-table tr:hover td{background:var(--bg3);}
.hist-date-cell{font-size:10px;color:var(--text3);text-align:left;}
.hist-lesson-cell{font-size:11px;color:var(--text2);text-align:left;}
.maru{color:var(--green);font-weight:700;}
.batsu{color:var(--red);font-weight:700;}
.hist-na{color:var(--text3);}

/* Err review */
.err-section{background:var(--yellow-bg);border:1px solid var(--yellow-border);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--yellow);}

/* Responsive */
@media(max-width:640px){
  .layout{grid-template-columns:1fr;}
  .side{position:relative;top:0;max-height:none;border-right:none;border-bottom:1px solid var(--border);}
  .content{max-height:none;}
}

/* Random mode button */
.btn-rand-on{background:var(--purple);border-color:var(--purple);color:#fff !important;font-weight:600;}
.btn-rand-on:hover{opacity:.85;}

/* ── ホーム画面 ───────────────────────────────────── */
.home-screen{display:flex;flex-direction:column;align-items:center;padding:40px 20px;min-height:calc(100vh - 56px);background:var(--bg);}
.home-title{font-size:28px;font-weight:700;color:#e6edf3;margin-bottom:8px;}
.home-subtitle{font-size:14px;color:#8b949e;margin-bottom:40px;}
.category-cards{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;max-width:900px;width:100%;}
.category-card{background:#21262d;border:1px solid #30363d;border-radius:12px;padding:28px 32px;cursor:pointer;transition:transform .15s,box-shadow .15s;min-width:280px;max-width:380px;flex:1;}
.category-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.category-card-icon{font-size:36px;margin-bottom:12px;}
.category-card-name{font-size:20px;font-weight:700;color:#e6edf3;margin-bottom:8px;}
.category-card-desc{font-size:13px;color:#8b949e;line-height:1.6;margin-bottom:16px;}
.category-card-stats{font-size:12px;color:var(--green);font-weight:600;}

/* ── ヘッダー改修 ─────────────────────────────────── */
/* 高さは固定(56px)。.hdr-tabs側をoverflow-x:autoにして横スクロールさせることで、
   ボタン数が増えても折り返してヘッダーの高さが伸びず、下の.layout/.side/.contentの
   固定オフセット(56px)とズレて重なるのを防ぐ */
.hdr{display:flex;align-items:center;gap:12px;padding:0 16px;height:56px;background:var(--hdr);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;}
.hdr-left{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.hdr-center{display:flex;justify-content:center;flex-shrink:0;}
.home-btn{background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:var(--r);padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;transition:background .15s;}
.home-btn:hover{background:var(--border);}
.category-select{background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:var(--r);padding:6px 12px;font-size:13px;cursor:pointer;min-width:200px;}
.category-select:focus{outline:none;border-color:var(--blue);}

</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <button class="home-btn" onclick="goHome()" title="ホームへ">🏠 ホーム</button>
    <div class="logo">📚 Study App</div>
  </div>
  <div class="hdr-center" id="hdr-category-area" style="display:none;">
    <select class="category-select" id="category-select" onchange="onCategoryChange(this.value)">
    </select>
  </div>
  <div class="hdr-tabs" id="hdr-tabs" style="display:none;">
    <button class="hdr-tab on" onclick="setMode('summary')">📄 要約</button>
    <button class="hdr-tab" onclick="setMode('quiz')">❓ 問題</button>
    <button class="hdr-tab" onclick="setMode('review')">🔴 復習</button>
    <button class="hdr-tab" onclick="setMode('weak')">🧠 苦手問題</button>
    <button class="hdr-tab" onclick="setMode('history')">📊 履歴</button>
  </div>
</div>

<!-- ホーム画面 -->
<div id="home-screen" class="home-screen" style="display:none;">
  <div class="home-title">📚 Study App</div>
  <div class="home-subtitle">カテゴリを選択して学習を開始してください</div>
  <div class="category-cards" id="category-cards"></div>
</div>

<!-- 学習画面 -->
<div class="layout" id="study-layout" style="display:none;">
  <div class="side" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────
const STORE_KEY = 'cmdb_study_v2';
// ── カテゴリ定義 ─────────────────────────────────────
const CATEGORIES = {
  'ServiceNow CIS-DF': { icon: '🔧', desc: '', color: '#4a90d9' }
};

let state = {
  lessons: [],       // [{id, course, lesson, title, summary, points:[], quiz:[]}]
  mode: 'summary',
  activeLesson: null,
  quizState: {},     // lessonId -> {scores:[], wrongs:[], done:false, current:0}
  history: [],       // [{lessonId, title, correct, total, date, wrongs:[]}]
  errors: {},        // lessonId -> Set of question indices that were ever wrong
  comments: {},      // 'lessonId_qi' -> comment text
  randomMode: false, // 選択肢ランダム表示モード
  shuffleMap: {},    // qkey_qi -> shuffled option indices
  currentCategory: null // 現在選択中のカテゴリ
};

function save() {
  const s = JSON.parse(JSON.stringify(state));
  // Convert sets to arrays for JSON
  s.errors = {};
  for (const k in state.errors) s.errors[k] = [...state.errors[k]];
  s.randomMode = state.randomMode;
  s.shuffleMap = state.shuffleMap;
  s.currentCategory = state.currentCategory;
  localStorage.setItem(STORE_KEY, JSON.stringify(s));
}

function load() {
  const raw = localStorage.getItem(STORE_KEY);
  try {
    const s = raw ? JSON.parse(raw) : {};
    state.lessons = s.lessons || [];
    state.history = s.history || [];
    state.quizState = s.quizState || {};
    state.errors = {};
    for (const k in (s.errors || {})) state.errors[k] = new Set(s.errors[k]);
    state.comments = s.comments || {};
    state.randomMode = s.randomMode || false;
    state.shuffleMap = s.shuffleMap || {};
    state.currentCategory = s.currentCategory || null;
    // コメントキーのマイグレーション（旧形式→新形式）
    if (s.comments) {
      const migratedComments = {};
      Object.keys(s.comments).forEach(k => {
        // Course1_1-1_1778297231376_0_2 → Course1_1-1_2
        // Course1_1-1_0_2 → Course1_1-1_2
        let nk = k.replace(/^([A-Za-z]+\d+_[\d\-]+)_\d{13}_\d+_(\d+)$/, '$1_$2');
        nk = nk.replace(/^([A-Za-z]+\d+_[\d\-]+)_\d{1,3}_(\d+)$/, '$1_$2');
        migratedComments[nk] = s.comments[k];
      });
      state.comments = migratedComments;
    }
    // カテゴリを全レッスンに付与（既存データ対応）
    state.lessons.forEach(l => {
      if (!l.category) l.category = 'ServiceNow CIS-DF';
    });
  } catch(e) { console.warn(e); }

  // 常にホーム画面から開始
  document.getElementById('home-screen').style.display = 'flex';
  document.getElementById('study-layout').style.display = 'none';
  document.getElementById('hdr-category-area').style.display = 'none';
  document.getElementById('hdr-tabs').style.display = 'none';
  renderHomeScreen();

  // GitHub管理のJSON(data/lessons.json)から問題データ・メモを読み込み
  // ※スプレッドシート(GAS)連携は廃止済み
  loadLessonsFromGithub();
}

// ── Mode ───────────────────────────────────────────────
function setMode(m) {
  state.mode = m;
  document.querySelectorAll('.hdr-tab').forEach((b,i) => {
    b.classList.toggle('on', ['summary','quiz','review','weak','history'][i] === m);
  });
  renderSidebar();
  renderContent();
}

function setActiveLesson(id) {
  state.activeLesson = id;
  renderSidebar();
  renderContent();
}

// ── Sidebar ────────────────────────────────────────────
function renderSidebar() {
  // カテゴリでフィルタ
  const lessons = state.currentCategory ? getLessonsForCategory(state.currentCategory) : state.lessons;
  const el = document.getElementById('sidebar');
  const mode = state.mode;
  let html = '';

  if (mode === 'history' || mode === 'weak') { el.innerHTML = ''; return; }
  if (mode === 'review') {
    html += `<div class="side-sec">復習リスト</div>`;
    const errLessons = lessons.filter(l => (state.errors[l.id]?.size || 0) > 0);
    if (errLessons.length === 0) {
      html += `<div style="padding:8px;font-size:12px;color:var(--text3);">間違えた問題はありません</div>`;
    } else {
      errLessons.forEach(l => {
        const cnt = state.errors[l.id]?.size || 0;
        const on = state.activeLesson === l.id ? ' on' : '';
        html += `<div class="litem${on}" onclick="setActiveLesson('${l.id}')">
          <span class="lbadge">${l.lesson}</span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${l.title}</span>
          <span class="lerr">${cnt}問</span>
        </div>`;
      });
    }
    el.innerHTML = html;
    return;
  }

  // Group by course
  const courses = {};
  lessons.forEach(l => {
    if (!courses[l.course]) courses[l.course] = [];
    courses[l.course].push(l);
  });

  Object.entries(courses).forEach(([course, lessons]) => {
    html += `<div class="side-sec">${course}</div>`;
    lessons.forEach(l => {
      const on = state.activeLesson === l.id ? ' on' : '';
      const qs = state.quizState[l.id];
      let scoreHtml = '';
      if (qs && qs.done) {
        const c = qs.scores.filter(x=>x===1).length;
        const t = qs.scores.length;
        scoreHtml = `<span class="lscore">${c}/${t}</span>`;
      }
      html += `<div class="litem${on}" onclick="setActiveLesson('${l.id}')">
        <span class="lbadge">${l.lesson}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;">${l.title}</span>
        ${scoreHtml}
        <button class="del-btn" onclick="event.stopPropagation();deleteLesson('${l.id}')">✕</button>
      </div>`;
    });
  });

  html += `<button class="add-btn" onclick="requestNewContent()">＋ 新しい問題を追加</button>`;
  el.innerHTML = html;
}

// ── Content ────────────────────────────────────────────
function renderContent() {
  const el = document.getElementById('content');
  const mode = state.mode;

  if (mode === 'history') { renderHistory(el); return; }
  if (mode === 'weak') { renderWeakQuiz(el); return; }

  if (!state.activeLesson) {
    el.innerHTML = `<div class="welcome">
      <div style="font-size:48px;">📚</div>
      <h2>レッスンを選択してください</h2>
      <p>左のサイドバーからレッスンを選んでください。新しい問題の追加は「＋ 新しい問題を追加」から。</p>
    </div>`;
    return;
  }

  const lesson = state.lessons.find(l => l.id === state.activeLesson);
  if (!lesson) { el.innerHTML = ''; return; }

  if (mode === 'summary') renderSummary(el, lesson);
  else if (mode === 'quiz') renderQuiz(el, lesson, false);
  else if (mode === 'review') renderQuiz(el, lesson, true);
}

// ── Summary ────────────────────────────────────────────
function renderSummary(el, lesson) {
  const hasPoints = lesson.points && lesson.points.length > 0;
  el.innerHTML = `
    <div class="sec-hdr">
      <span class="course-chip">${lesson.course} · ${lesson.lesson}</span>
      <span class="sec-title">${lesson.title}</span>
    </div>
    <div class="sub-tabs">
      <button class="stab on" id="stab-sum" onclick="switchSTab('sum')">原文ベース要約</button>
      ${hasPoints ? `<button class="stab" id="stab-pts" onclick="switchSTab('pts')">試験対策ポイント</button>` : ''}
    </div>
    <div id="spanel-sum">
      <div class="copy-row">
        <button class="btn" onclick="copyText('summary-text')">📋 コピー</button>
      </div>
      <div class="sum-box" id="summary-text">${escHtml(lesson.summary || '要約データがありません')}</div>
    </div>
    ${hasPoints ? `<div id="spanel-pts" style="display:none;">
      <div class="copy-row">
        <button class="btn" onclick="copyPoints()">📋 TSVコピー</button>
      </div>
      <table class="ptable">
        <thead><tr><th>カテゴリ</th><th>ポイント</th><th>補足</th></tr></thead>
        <tbody>${lesson.points.map(p=>`<tr><td>${escHtml(p[0]||'')}</td><td>${escHtml(p[1]||'')}</td><td>${escHtml(p[2]||'')}</td></tr>`).join('')}</tbody>
      </table>

}

function switchSTab(t) {
  ['sum','pts'].forEach(s => {
    const tab = document.getElementById('stab-'+s);
    const panel = document.getElementById('spanel-'+s);
    if (tab) tab.classList.toggle('on', s===t);
    if (panel) panel.style.display = s===t ? 'block' : 'none';
  });
}

function copyText(id) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => {
    const lesson = state.lessons.find(l=>l.id===state.activeLesson);
    if (lesson) showToast('コピーしました');
  });
}

function copyPoints() {
  const lesson = state.lessons.find(l=>l.id===state.activeLesson);
  if (!lesson || !lesson.points) return;
  const header = 'カテゴリ\tポイント\t補足';
  const rows = lesson.points.map(p=>p.join('\t')).join('\n');
  navigator.clipboard.writeText(header+'\n'+rows).then(()=>showToast('TSVコピーしました'));
}

// ── Quiz ───────────────────────────────────────────────
function renderQuiz(el, lesson, isReview) {
  const lid = lesson.id;
  const allQ = lesson.quiz || [];

  // For review mode, filter to error questions only
  let questions = allQ;
  let errIndices = null;
  if (isReview) {
    const errSet = state.errors[lid] || new Set();
    errIndices = [...errSet].filter(i => i < allQ.length);
    questions = errIndices.map(i => allQ[i]);
    if (questions.length === 0) {
      el.innerHTML = `<div class="welcome">
        <div style="font-size:48px;">🎉</div>
        <h2>復習問題はありません</h2>
        <p>このレッスンで間違えた問題はまだありません。<br>問題モードで挑戦してみましょう！</p>
      </div>`;
      return;
    }
  }

  const qkey = isReview ? lid+'_review' : lid;
  if (!state.quizState[qkey] || state.quizState[qkey].total !== questions.length) {
    state.quizState[qkey] = {
      scores: new Array(questions.length).fill(null),
      wrongs: new Array(questions.length).fill(null),
      done: false,
      total: questions.length
    };
  }
  const qs = state.quizState[qkey];
  const correct = qs.scores.filter(x=>x===1).length;
  const answered = qs.scores.filter(x=>x!==null).length;
  const errCount = (isReview ? 0 : (state.errors[lid]?.size || 0));

  const randOn = state.randomMode;
  let html = `
    <div class="sec-hdr">
      <span class="course-chip">${lesson.course} · ${lesson.lesson}</span>
      <span class="sec-title">${lesson.title}${isReview?' — 復習モード':''}</span>
    </div>
    <div class="quiz-bar">
      <span class="score-chip">${correct} / ${answered}</span>
      ${!isReview && errCount > 0 ? `<span class="err-chip">🔴 ${errCount}問ミス</span>` : ''}
      <button class="btn" onclick="resetQuiz('${qkey}',${isReview})">🔄 リセット</button>
      <button class="btn${randOn?' btn-rand-on':''}" onclick="toggleRandom()" title="選択肢の順番をランダムに表示">🔀 ランダム${randOn?' ON':' OFF'}</button>
      ${answered > 0 ? `<button class="btn btn-y" onclick="saveHistory('${lid}','${qkey}')">💾 履歴保存</button>` : ''}
    </div>
  `;

  if (isReview && questions.length > 0) {
    html += `<div class="err-section">🔴 間違えた ${questions.length} 問を復習中</div>`;
  }

  questions.forEach((q, qi) => {
    const done = qs.scores[qi] !== null;
    const wasOk = qs.scores[qi] === 1;
    html += `<div class="qcard${done?(wasOk?' answered-ok':' answered-ng'):''}" id="qc_${qkey}_${qi}">
      <div class="qno">${isReview ? `復習 Q${qi+1}` : `Q${qi+1}`}</div>
      <span class="tbadge t${q.type}">${q.type}</span>
      <div class="qtext">${escHtml(q.q)}</div>
      ${renderQuestionImage(q.img)}`;

    const isMulti = Array.isArray(q.multi) && q.multi.length > 0;
    if (isMulti) {
      // 複数選択問題
      html += `<div class="multi-hint">💡 ${q.multi.length}つ選択してください</div>`;
      q.opts.forEach((o, oi) => {
        let cls = '';
        if (done) {
          if (q.multi.includes(oi)) cls = ' ok';
          else if (qs.wrongs[qi] && qs.wrongs[qi].includes(oi)) cls = ' ng';
        }
        const multiKey = qkey + '_' + qi;
        const alreadySel = (!done && multiSelections[multiKey] && multiSelections[multiKey].has(oi)) ? ' sel-multi' : '';
        html += `<button class="opt${cls}${alreadySel}" ${done?'disabled':''} id="mopt_${qkey}_${qi}_${oi}" onclick="toggleMulti('${qkey}',${qi},${oi})">${String.fromCharCode(65+oi)}. ${escHtml(o)}</button>`;
      });
      if (!done) {
        const multiKey2 = qkey + '_' + qi;
        const curSelCount = (multiSelections[multiKey2] && multiSelections[multiKey2].size) || 0;
        const subDisabled = curSelCount !== q.multi.length ? 'disabled' : '';
        html += `<button class="multi-submit" id="msub_${qkey}_${qi}" onclick="submitMulti('${qkey}',${qi},${isReview},${JSON.stringify(isReview?(errIndices||[]):[])})" ${subDisabled}>回答する（${curSelCount}/${q.multi.length}選択）</button>`;
      }
    } else {
      // 単一選択問題（ランダムモード対応）
      const smKey = qkey + '_' + qi;
      let optOrder;
      if (state.randomMode) {
        if (!state.shuffleMap[smKey]) {
          // まだシャッフルされていない場合は新規シャッフル
          const arr = q.opts.map((_,i)=>i);
          for (let i=arr.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]; }
          state.shuffleMap[smKey] = arr;
        }
        optOrder = state.shuffleMap[smKey];
      } else {
        optOrder = q.opts.map((_,i)=>i);
      }
      optOrder.forEach((oi, dispIdx) => {
        const o = q.opts[oi];
        let cls = '';
        if (done) {
          if (oi === q.ans) cls = ' ok';
          else if (oi === qs.wrongs[qi] && !wasOk) cls = ' ng';
        }
        html += `<button class="opt${cls}"${done?' disabled':''} onclick="answerQ('${qkey}',${qi},${oi},${isReview},${JSON.stringify(isReview ? (errIndices||[]) : [])})">${String.fromCharCode(65+dispIdx)}. ${escHtml(o)}</button>`;
      });
    }

    if (done) {
      const expCls = wasOk ? 'exp-ok' : 'exp-ng';
      const label = wasOk ? '✅ 正解！' : '❌ 不正解';
      const annotatedExp = addJpAnnotations(escHtml(q.exp));
      let reason = '';
      if (isMulti) {
        const correctLabels = q.multi.map(i => String.fromCharCode(65+i)+':'+q.opts[i]).join('・');
        reason = wasOk
          ? `<span class="exp-label">${label}</span>正解の組み合わせを選択できました！`
          : `<span class="exp-label">${label}</span>正解は「${correctLabels}」です。`;
      } else {
        const annotatedOptCorrect = addJpAnnotations(escHtml(q.opts[q.ans]));
        const annotatedOptWrong = (!wasOk && qs.wrongs[qi] != null) ? addJpAnnotations(escHtml(q.opts[qs.wrongs[qi]])) : '';
        reason = wasOk
          ? `<span class="exp-label">${label}</span>正解です！`
          : `<span class="exp-label">${label}</span>正解は「${String.fromCharCode(65+q.ans)}：${annotatedOptCorrect}」です。`;
      }
      html += `<div class="exp ${expCls}">${reason}</div>`;
      // コメント欄（回答後のみ表示）
      const cKey = lesson.course.replace(/\s/g,'') + '_' + lesson.lesson + '_' + qi;
      const savedComment = (state.comments||{})[cKey] || '';
      html += `<div class="comment-box">
        <div class="comment-label">📝 メモ・コメント（内容は自動保存されます）</div>
        <textarea class="comment-ta" id="cmt_${qkey}_${qi}" placeholder="ここに気づきや疑問点を記録できます..."
          oninput="autoResizeMemo(this);saveCommentFixed('${lesson.course.replace(/\s/g,'')}','${lesson.lesson}',${qi},this.value)">${escHtml(savedComment)}</textarea>
      </div>`;
    }

    html += `</div>`;
  });

  el.innerHTML = html;
  // メモ欄の高さを保存済みテキストに合わせて自動調整
  setTimeout(() => {
    document.querySelectorAll('.comment-ta').forEach(ta => {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    });
  }, 0);
}

// ── 複数選択問題の処理 ──────────────────────────────────
const multiSelections = {}; // qkey_qi -> Set of selected indices

function toggleMulti(qkey, qi, oi) {
  const key = qkey + '_' + qi;
  if (!multiSelections[key]) multiSelections[key] = new Set();
  const sel = multiSelections[key];
  const btn = document.getElementById('mopt_' + qkey + '_' + qi + '_' + oi);
  if (sel.has(oi)) {
    sel.delete(oi);
    if (btn) btn.classList.remove('sel-multi');
  } else {
    sel.add(oi);
    if (btn) btn.classList.add('sel-multi');
  }
  // 回答するボタンの有効/無効とカウント更新
  const lid = state.activeLesson;
  const lesson = state.lessons.find(l=>l.id===lid);
  if (!lesson) return;
  const allQ = lesson.quiz || [];
  const q = allQ[qi];
  const subBtn = document.getElementById('msub_' + qkey + '_' + qi);
  if (subBtn && q && q.multi) {
    const ready = sel.size === q.multi.length;
    subBtn.disabled = !ready;
    subBtn.textContent = '回答する（' + sel.size + '/' + q.multi.length + '選択）';
  }
}

function submitMulti(qkey, qi, isReview, errIndices) {
  const lid = state.activeLesson;
  const lesson = state.lessons.find(l=>l.id===lid);
  if (!lesson) return;
  const allQ = lesson.quiz || [];
  const questions = isReview ? errIndices.map(i=>allQ[i]) : allQ;
  const q = questions[qi];
  if (!q || !q.multi) return;

  const key = qkey + '_' + qi;
  const sel = multiSelections[key] || new Set();
  const selectedArr = [...sel].sort();
  const correctArr = [...q.multi].sort();
  const correct = selectedArr.length === correctArr.length &&
    selectedArr.every((v,i) => v === correctArr[i]);

  const qs = state.quizState[qkey];
  qs.scores[qi] = correct ? 1 : 0;
  qs.wrongs[qi] = selectedArr; // 選択したインデックス配列を記録

  const realIdx = isReview ? errIndices[qi] : qi;
  if (!correct) {
    if (!state.errors[lid]) state.errors[lid] = new Set();
    state.errors[lid].add(realIdx);
  } else {
    if (isReview && state.errors[lid]) {
      state.errors[lid].delete(realIdx);
      if (state.errors[lid].size === 0) delete state.errors[lid];
    }
  }

  if (qs.scores.every(s=>s!==null)) qs.done = true;
  save();
  renderContent();
  renderSidebar();
  setTimeout(() => {
    const card = document.getElementById('qc_' + qkey + '_' + qi);
    if (card) card.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 100);
}

function autoResizeMemo(el) {

}

// ── ホーム画面 ─────────────────────────────────────────
function goHome() {
  state.currentCategory = null;
  save();
  document.getElementById('home-screen').style.display = 'flex';

  document.getElementById('hdr-category-area').style.display = 'none';

  state.lessons.forEach(l => {

    stats[cat].lessons++;
    stats[cat].questions += (l.quiz || []).length;
  });

  let html = '';
  Object.keys(CATEGORIES).forEach(catName => {

function selectCategory(catName) {
  state.currentCategory = catName;

  document.getElementById('study-layout').style.display = 'flex';

function updateCategorySelect(currentCat) {
  const sel = document.getElementById('category-select');

  let html = '';

function onCategoryChange(catName) {

// ── カテゴリでレッスンをフィルタ ───────────────────────
function getLessonsForCategory(catName) {
  return state.lessons.filter(l => (l.category || 'ServiceNow CIS-DF') === catName);
}

// ── 苦手問題コース（現在のカテゴリで一度でも間違えた問題を横断集計）──
const weakQuizCache = {}; // qkey -> 出題スナップショット（セッション中は固定）

function getWeakQuestions() {
  const cat = state.currentCategory;
  const catLessons = cat ? getLessonsForCategory(cat) : state.lessons;
  const list = [];
  catLessons.forEach(l => {
    const errSet = state.errors[l.id];
    if (!errSet || errSet.size === 0) return;
    const allQ = l.quiz || [];
    [...errSet].sort((a,b)=>a-b).forEach(qi => {
      if (qi < allQ.length) {
        list.push({ ...allQ[qi], lessonId: l.id, srcQi: qi, course: l.course, lesson: l.lesson, title: l.title });
      }
    });
  });
  return list;
}

function weakKey() {
  return 'weak_' + (state.currentCategory || 'all');
}

function renderWeakQuiz(el) {
  const qkey = weakKey();
  if (!weakQuizCache[qkey]) weakQuizCache[qkey] = getWeakQuestions();
  const questions = weakQuizCache[qkey];

  if (questions.length === 0) {
    delete weakQuizCache[qkey];
    el.innerHTML = `<div class="welcome">
      <div style="font-size:48px;">🎉</div>
      <h2>苦手問題はありません</h2>
      <p>問題モードで間違えるとここに集まります。<br>${state.currentCategory ? escHtml(state.currentCategory) + '内の' : ''}全レッスンを横断して出題されます。</p>
    </div>`;
    return;
  }

  if (!state.quizState[qkey] || state.quizState[qkey].total !== questions.length) {
    state.quizState[qkey] = {
      scores: new Array(questions.length).fill(null),
      wrongs: new Array(questions.length).fill(null),
      done: false,
      total: questions.length
    };
  }
  const qs = state.quizState[qkey];
  const correct = qs.scores.filter(x=>x===1).length;
  const answered = qs.scores.filter(x=>x!==null).length;

  let html = `
    <div class="sec-hdr">
      <span class="sec-title">🧠 苦手問題コース（${escHtml(state.currentCategory||'全カテゴリ')}） — 全${questions.length}問</span>
    </div>
    <div class="quiz-bar">
      <span class="score-chip">${correct} / ${answered}</span>
      <button class="btn" onclick="resetWeakQuiz('${qkey}')">🔄 リセット（出題し直し）</button>
    </div>
    <div class="err-section">🧠 これまでに間違えたことのある問題を、コース・レッスン横断で ${questions.length} 問出題しています。正解すると苦手問題から外れます。</div>
  `;

  questions.forEach((q, qi) => {
    const done = qs.scores[qi] !== null;
    const wasOk = qs.scores[qi] === 1;
    const isMulti = Array.isArray(q.multi) && q.multi.length > 0;
    html += `<div class="qcard${done?(wasOk?' answered-ok':' answered-ng'):''}" id="qc_${qkey}_${qi}">
      <div class="qno">Q${qi+1}<span class="qsrc">${escHtml(q.course)} ・ ${escHtml(q.lesson)} ${escHtml(q.title||'')}</span></div>
      <span class="tbadge t${q.type}">${q.type}</span>
      <div class="qtext">${escHtml(q.q)}</div>
      ${renderQuestionImage(q.img)}`;

    if (isMulti) {
      html += `<div class="multi-hint">💡 ${q.multi.length}つ選択してください</div>`;
      q.opts.forEach((o, oi) => {
        let cls = '';
        if (done) {
          if (q.multi.includes(oi)) cls = ' ok';
          else if (qs.wrongs[qi] && qs.wrongs[qi].includes(oi)) cls = ' ng';
        }
        const multiKey = qkey + '_' + qi;
        const alreadySel = (!done && multiSelections[multiKey] && multiSelections[multiKey].has(oi)) ? ' sel-multi' : '';
        html += `<button class="opt${cls}${alreadySel}" ${done?'disabled':''} id="mopt_${qkey}_${qi}_${oi}" onclick="toggleWeakMulti('${qkey}',${qi},${oi})">${String.fromCharCode(65+oi)}. ${escHtml(o)}</button>`;
      });
      if (!done) {
        const multiKey2 = qkey + '_' + qi;
        const curSelCount = (multiSelections[multiKey2] && multiSelections[multiKey2].size) || 0;
        const subDisabled = curSelCount !== q.multi.length ? 'disabled' : '';
        html += `<button class="multi-submit" id="msub_${qkey}_${qi}" onclick="submitWeakMulti('${qkey}',${qi})" ${subDisabled}>回答する（${curSelCount}/${q.multi.length}選択）</button>`;
      }
    } else {
      q.opts.forEach((o, oi) => {
        let cls = '';
        if (done) {
          if (oi === q.ans) cls = ' ok';
          else if (oi === qs.wrongs[qi] && !wasOk) cls = ' ng';
        }
        html += `<button class="opt${cls}"${done?' disabled':''} onclick="answerWeakQ('${qkey}',${qi},${oi})">${String.fromCharCode(65+oi)}. ${escHtml(o)}</button>`;
      });
    }

    if (done) {
      const expCls = wasOk ? 'exp-ok' : 'exp-ng';
      const label = wasOk ? '✅ 正解！' : '❌ 不正解';
      let reason = '';
      if (isMulti) {
        const correctLabels = q.multi.map(i => String.fromCharCode(65+i)+':'+q.opts[i]).join('・');
        reason = wasOk
          ? `<span class="exp-label">${label}</span>正解の組み合わせを選択できました！`
          : `<span class="exp-label">${label}</span>正解は「${correctLabels}」です。`;
      } else {
        const annotatedOptCorrect = addJpAnnotations(escHtml(q.opts[q.ans]));
        reason = wasOk
          ? `<span class="exp-label">${label}</span>正解です！`
          : `<span class="exp-label">${label}</span>正解は「${String.fromCharCode(65+q.ans)}：${annotatedOptCorrect}」です。`;
      }
      html += `<div class="exp ${expCls}">${reason}</div>`;
      const cKey = q.course.replace(/\s/g,'') + '_' + q.lesson + '_' + q.srcQi;
      const savedComment = (state.comments||{})[cKey] || '';
      html += `<div class="comment-box">
        <div class="comment-label">📝 メモ・コメント（内容は自動保存されます）</div>
        <textarea class="comment-ta" id="cmt_${qkey}_${qi}" placeholder="ここに気づきや疑問点を記録できます..."
          oninput="autoResizeMemo(this);saveCommentFixed('${q.course.replace(/\s/g,'')}','${q.lesson}',${q.srcQi},this.value)">${escHtml(savedComment)}</textarea>
      </div>`;
    }

    html += `</div>`;
  });

  el.innerHTML = html;
  setTimeout(() => {
    document.querySelectorAll('.comment-ta').forEach(ta => {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    });
  }, 0);
}

function answerWeakQ(qkey, qi, chosen) {
  const questions = weakQuizCache[qkey];
  if (!questions) return;
  const q = questions[qi];
  if (!q) return;
  const qs = state.quizState[qkey];
  const correct = chosen === q.ans;
  qs.scores[qi] = correct ? 1 : 0;
  qs.wrongs[qi] = chosen;

  if (!correct) {
    if (!state.errors[q.lessonId]) state.errors[q.lessonId] = new Set();
    state.errors[q.lessonId].add(q.srcQi);
  } else if (state.errors[q.lessonId]) {
    state.errors[q.lessonId].delete(q.srcQi);
    if (state.errors[q.lessonId].size === 0) delete state.errors[q.lessonId];
  }

  if (qs.scores.every(s=>s!==null)) qs.done = true;
  save();
  renderContent();
  renderSidebar();
  setTimeout(() => {
    const card = document.getElementById(`qc_${qkey}_${qi}`);
    if (card) card.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 100);
}

function toggleWeakMulti(qkey, qi, oi) {
  const key = qkey + '_' + qi;
  if (!multiSelections[key]) multiSelections[key] = new Set();
  const sel = multiSelections[key];
  const btn = document.getElementById('mopt_' + qkey + '_' + qi + '_' + oi);
  if (sel.has(oi)) {
    sel.delete(oi);
    if (btn) btn.classList.remove('sel-multi');
  } else {
    sel.add(oi);
    if (btn) btn.classList.add('sel-multi');
  }
  const questions = weakQuizCache[qkey];
  const q = questions && questions[qi];
  const subBtn = document.getElementById('msub_' + qkey + '_' + qi);
  if (subBtn && q && q.multi) {
    const ready = sel.size === q.multi.length;
    subBtn.disabled = !ready;
    subBtn.textContent = '回答する（' + sel.size + '/' + q.multi.length + '選択）';
  }
}

function submitWeakMulti(qkey, qi) {
  const questions = weakQuizCache[qkey];
  if (!questions) return;
  const q = questions[qi];
  if (!q || !q.multi) return;

  const key = qkey + '_' + qi;
  const sel = multiSelections[key] || new Set();
  const selectedArr = [...sel].sort();
  const correctArr = [...q.multi].sort();
  const correct = selectedArr.length === correctArr.length &&
    selectedArr.every((v,i) => v === correctArr[i]);

  const qs = state.quizState[qkey];
  qs.scores[qi] = correct ? 1 : 0;
  qs.wrongs[qi] = selectedArr;

  if (!correct) {
    if (!state.errors[q.lessonId]) state.errors[q.lessonId] = new Set();
    state.errors[q.lessonId].add(q.srcQi);
  } else if (state.errors[q.lessonId]) {
    state.errors[q.lessonId].delete(q.srcQi);
    if (state.errors[q.lessonId].size === 0) delete state.errors[q.lessonId];
  }

  if (qs.scores.every(s=>s!==null)) qs.done = true;
  save();
  renderContent();
  renderSidebar();
  setTimeout(() => {
    const card = document.getElementById('qc_' + qkey + '_' + qi);
    if (card) card.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 100);
}

function resetWeakQuiz(qkey) {
  const shuffleKeys = Object.keys(state.shuffleMap).filter(k=>k.startsWith(qkey));
  shuffleKeys.forEach(k=>delete state.shuffleMap[k]);
  delete state.quizState[qkey];
  delete weakQuizCache[qkey];
  save();
  renderContent();
}

function toggleRandom() {
  state.randomMode = !state.randomMode;
  // シャッフルマップをリセット（新しいモードで再シャッフル）
  state.shuffleMap = {};
  save();
  renderContent();
}

function answerQ(qkey, qi, chosen, isReview, errIndices) {
  const lid = state.activeLesson;
  const lesson = state.lessons.find(l=>l.id===lid);
  if (!lesson) return;

  const allQ = lesson.quiz || [];
  const questions = isReview ? errIndices.map(i=>allQ[i]) : allQ;
  const q = questions[qi];
  if (!q) return;

  const qs = state.quizState[qkey];
  const correct = chosen === q.ans;
  qs.scores[qi] = correct ? 1 : 0;
  qs.wrongs[qi] = chosen;

  // Record error
  const realIdx = isReview ? errIndices[qi] : qi;
  if (!correct) {
    if (!state.errors[lid]) state.errors[lid] = new Set();
    state.errors[lid].add(realIdx);
  } else {
    // Remove from errors only if answered correctly in review mode
    if (isReview && state.errors[lid]) {
      state.errors[lid].delete(realIdx);
      if (state.errors[lid].size === 0) delete state.errors[lid];
    }
  }

  if (qs.scores.every(s=>s!==null)) qs.done = true;

  save();
  renderContent();
  renderSidebar();

  // Scroll to answered card
  setTimeout(() => {
    const card = document.getElementById(`qc_${qkey}_${qi}`);
    if (card) card.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 100);
}

function resetQuiz(qkey, isReview) {
  // シャッフルマップもリセット
  const shuffleKeys = Object.keys(state.shuffleMap).filter(k=>k.startsWith(qkey));
  shuffleKeys.forEach(k=>delete state.shuffleMap[k]);
  delete state.quizState[qkey];
  save();
  renderContent();
}

function saveHistory(lid, qkey) {
  const lesson = state.lessons.find(l=>l.id===lid);
  const qs = state.quizState[qkey];
  if (!lesson || !qs) return;
  const correct = qs.scores.filter(x=>x===1).length;
  const total = qs.scores.length;
  const errArr = [];
  qs.scores.forEach((s,i) => { if (s===0) errArr.push(i); });

  // 日時生成
  const now = new Date();
  const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  // localStorageの履歴に追加
  state.history.unshift({
    lessonId: lid,
    category: lesson.category || 'ServiceNow CIS-DF',
    course: lesson.course,
    lesson: lesson.lesson,
    title: lesson.title,
    correct,
    total,
    date: dateStr,
    wrongs: errArr,
    scores: qs.scores.slice() // 各問題の正解(1)/不正解(0)/未回答(null)を○×表示用に保持
  });
  save();

  // スプレッドシートに送信
  const records = [];
  qs.scores.forEach((score, qi) => {
    records.push({
      date: dateStr,
      category: lesson.category || 'ServiceNow CIS-DF',
      course: lesson.course,
      lesson: lesson.lesson,
      qno: `Q${qi+1}`,
      result: score === 1 ? '正解' : '不正解'
    });
  });
  sendToSheet('saveHistory', { records });

  renderContent();
  showToast('📊 履歴を保存しました');
}


// コースごとの履歴表示件数（1 / 10 / 20 / 全件）。永続化不要のUI状態のためモジュール変数で保持
const historyViewCount = {};

function renderHistory(el) {
  // 現在選択中のカテゴリの履歴のみに絞り込む
  const history = state.currentCategory
    ? state.history.filter(h => (h.category || 'ServiceNow CIS-DF') === state.currentCategory)
    : state.history;

  if (history.length === 0) {
    el.innerHTML = `<div class="welcome"><div style="font-size:48px;">📊</div><h2>履歴がありません</h2><p>問題モードで回答後「履歴保存」ボタンを押すと記録されます。</p></div>`;
    return;
  }

  // コースごとにグループ化（履歴は新しい順に並んでいるためグループ内も新しい順）
  const groups = {};
  history.forEach(h => {
    if (!groups[h.course]) groups[h.course] = [];
    groups[h.course].push(h);
  });

  let html = `<div class="sec-hdr"><span class="sec-title">📊 回答履歴</span><button class="btn" onclick="copyAnalysisText()">🤖 AI分析用にコピー</button><button class="btn btn-d" onclick="clearHistory()">🗑 全削除</button></div>`;

  Object.entries(groups).forEach(([course, entries]) => {
    const viewCount = historyViewCount[course] || 10;
    const shown = viewCount === 'all' ? entries : entries.slice(0, viewCount);
    const maxQ = shown.reduce((m,h) => Math.max(m, h.total || 0), 0);
    const courseJs = course.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

    html += `<div class="hist-course-sec">`;
    html += `<div class="hist-course-hdr">
      <span class="hist-course-name">${escHtml(course)}</span>
      <span class="hist-count-tabs">
        ${[1,10,20,'all'].map(c => `<button class="hist-count-btn${viewCount===c?' on':''}" onclick="setHistoryViewCount('${courseJs}',${c==='all'?"'all'":c})">${c==='all'?'全件':c+'回'}</button>`).join('')}
      </span>
    </div>`;

    html += `<div class="hist-table-wrap"><table class="hist-table"><thead><tr>
      <th>日時</th><th>レッスン</th><th>点数</th>`;
    for (let qi=0; qi<maxQ; qi++) html += `<th>Q${qi+1}</th>`;
    html += `</tr></thead><tbody>`;
    shown.forEach(h => {
      const pct = h.total ? Math.round(h.correct/h.total*100) : 0;
      const cls = pct>=80?'ok':'ng';
      html += `<tr><td class="hist-date-cell">${h.date}</td><td class="hist-lesson-cell">${escHtml(h.lesson)} ${escHtml(h.title||'')}</td><td><span class="hist-score ${cls}">${h.correct}/${h.total}</span></td>`;
      for (let qi=0; qi<maxQ; qi++) {
        if (qi >= h.total) { html += `<td></td>`; continue; }
        let mark;
        if (h.scores) {
          // 新形式：正解(1)/不正解(0)/未回答(null)を判別
          if (h.scores[qi] === 1) mark = `<span class="maru">○</span>`;
          else if (h.scores[qi] === 0) mark = `<span class="batsu">✕</span>`;
          else mark = `<span class="hist-na">-</span>`;
        } else {
          // 旧データ（scores未保存）：wrongsのみから判定
          mark = h.wrongs && h.wrongs.includes(qi) ? `<span class="batsu">✕</span>` : `<span class="maru">○</span>`;
        }
        html += `<td>${mark}</td>`;
      }
      html += `</tr>`;
    });
    html += `</tbody></table></div></div>`;
  });

  el.innerHTML = html;
}

function setHistoryViewCount(course, count) {
  historyViewCount[course] = count;
  renderHistory(document.getElementById('content'));
}

// ── AI分析用データ生成 ────────────────────────────────
// 指定レッスン・問題番号について、履歴全体から間違えた回数／受験回数を集計
function getQuestionStats(lessonId, qi) {
  let attempts = 0, wrong = 0;
  state.history.forEach(h => {
    if (h.lessonId !== lessonId || qi >= (h.total || 0)) return;
    attempts++;
    if (h.scores) { if (h.scores[qi] === 0) wrong++; }
    else if (h.wrongs && h.wrongs.includes(qi)) wrong++;
  });
  return { attempts, wrong };
}

function buildAnalysisText() {
  const cat = state.currentCategory || '全カテゴリ';
  const history = state.currentCategory
    ? state.history.filter(h => (h.category || 'ServiceNow CIS-DF') === state.currentCategory)
    : state.history;

  const now = new Date();
  const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const lines = [];
  lines.push(`# ${cat} 学習分析データ（${dateStr}生成）`);
  lines.push('');

  // コース別成績サマリー
  const courseGroups = {};
  history.forEach(h => {
    if (!courseGroups[h.course]) courseGroups[h.course] = [];
    courseGroups[h.course].push(h);
  });
  lines.push('## コース別成績サマリー');
  if (Object.keys(courseGroups).length === 0) {
    lines.push('（テスト履歴がありません）');
  } else {
    Object.entries(courseGroups).forEach(([course, entries]) => {
      const totalCorrect = entries.reduce((s,h)=>s+h.correct,0);
      const totalQ = entries.reduce((s,h)=>s+h.total,0);
      const avgPct = totalQ ? Math.round(totalCorrect/totalQ*100) : 0;
      const recent = entries.slice(0,5).map(h=>`${h.correct}/${h.total}`).join('、');
      lines.push(`- ${course}：受験${entries.length}回／平均正答率${avgPct}%／直近の結果: ${recent}`);
    });
  }
  lines.push('');

  // 苦手問題一覧（現時点で間違えたままの問題。カテゴリ内を横断）
  const weak = getWeakQuestions();
  lines.push(`## 現在の苦手問題一覧（${weak.length}問）`);
  if (weak.length === 0) {
    lines.push('（現在、苦手問題はありません）');
  } else {
    weak.forEach((q, i) => {
      const stats = getQuestionStats(q.lessonId, q.srcQi);
      const ansText = Array.isArray(q.multi) ? q.multi.map(idx=>q.opts[idx]).join('・') : q.opts[q.ans];
      lines.push(`${i+1}. [${q.course} ${q.lesson}] (${q.type}) ${q.q}`);
      lines.push(`   正解: ${ansText} ／ この問題の被受験${stats.attempts}回中${stats.wrong}回不正解`);
    });
  }
  lines.push('');
  lines.push('## お願い');
  lines.push('上記は資格試験対策アプリの学習履歴データです。コース別の得意・不得意、繰り返し間違えている問題の傾向を分析したうえで、今後どの分野を重点的に学習すべきか、優先して復習すべき問題、次の学習の進め方を提案してください。');

  return lines.join('\n');
}

function copyAnalysisText() {
  const text = buildAnalysisText();
  navigator.clipboard.writeText(text).then(() => {
    showToast('🤖 AI分析用データをコピーしました。AIチャットに貼り付けてご利用ください');
  });
}

// ── 英語キーワードに日本語補足を付与 ──────────────────────
const JP_MAP = [
  [/\bCIクラス\b/g,'CIクラス'],
  [/\bCIs\b/g,'CIs（構成アイテム群）'],
  [/\bCI(?!（|クラス|名|的|情|的)/g,'CI（構成アイテム）'],
  [/\bIRE\b/g,'IRE（識別・照合エンジン）'],
  [/\bCSDM\b/g,'CSDM（共通サービスデータモデル）'],
  [/\bMID Server\b/gi,'MID Server（仲介サーバー）'],
  [/\bdiscovery source\b/gi,'discovery source（ディスカバリソース）'],
  [/\bnon-discoverable data\b/gi,'non-discoverable data（自動検出不可データ）'],
  [/\bLife Cycle Stage Status\b/gi,'Life Cycle Stage Status（ライフサイクルステージステータス）'],
  [/\bLife Cycle Stage\b/gi,'Life Cycle Stage（ライフサイクルステージ）'],
  [/\bAttestation\b/gi,'Attestation（証明）'],
  [/\bCompleteness\b/g,'Completeness（完全性）'],
  [/\bCompliance\b/g,'Compliance（コンプライアンス）'],
  [/\bCorrectness\b/g,'Correctness（正確性）'],
  [/\bStaleness\b/g,'Staleness（陳腐化）'],
  [/\bOrphan CI\b/gi,'Orphan CI（孤立CI）'],
  [/\bDuplicate CI\b/gi,'Duplicate CI（重複CI）'],
  [/\bStale CI\b/gi,'Stale CI（陳腐化CI）'],
  [/\bOrphan\b/g,'Orphan（孤立）'],
  [/\bDuplicate\b/g,'Duplicate（重複）'],
  [/\bUpgrade\b/g,'Upgrade（アップグレード）'],
  [/\bDowngrade\b/g,'Downgrade（ダウングレード）'],
  [/\bManaged By Group\b/gi,'Managed By Group（管理グループ）'],
  [/\bSupport Group\b/gi,'Support Group（サポートグループ）'],
  [/\bChange Group\b/gi,'Change Group（変更グループ）'],
  [/\bInstall Status\b/gi,'Install Status（インストールステータス）'],
  [/\bOperational Status\b/gi,'Operational Status（運用ステータス）'],
  [/\bAssignment Group\b/gi,'Assignment Group（担当グループ）'],
  [/\bRetired\b/g,'Retired（廃止済み）'],
  [/\bRetire\b/g,'Retire（廃止）'],
  [/\bDesired State\b/gi,'Desired State（望ましい状態）'],
  [/\bNLQ\b/g,'NLQ（自然言語クエリ）'],
  [/\bsys_updated_on\b/g,'sys_updated_on（最終更新日時フィールド）'],
  [/\bCI Class Manager\b/gi,'CI Class Manager（CIクラスマネージャー）'],
  [/\bCMDB Workspace\b/gi,'CMDB Workspace（CMDBワークスペース）'],
  [/\bImport Set\b/gi,'Import Set（インポートセット）'],
  [/\bTransform Map\b/gi,'Transform Map（変換マップ）'],
  [/\bService Mapping\b/g,'Service Mapping（サービスマッピング）'],
  [/\bpolicy-driven framework\b/gi,'policy-driven framework（ポリシー駆動型フレームワーク）'],
];
function addJpAnnotations(text) {
  if (!text) return text;
  return JP_MAP.reduce((t, [p, r]) => {
    try { return t.replace(p, (m, ...args) => {
      const idx = args[args.length-2];
      const before = t.slice(Math.max(0,idx-1), idx);
      const after = t.slice(idx+m.length, idx+m.length+1);
      if (after === '（') return m;
      return r;
    }); } catch(e) { return t; }
  }, text);
}

function saveCommentFixed(course, lesson, qi, text) {
  if (!state.comments) state.comments = {};
  const key = course + '_' + lesson + '_' + qi;
  state.comments[key] = text;
  save();

  // スプレッドシートに送信（デバウンス）
  clearTimeout(window._memoTimer);
  window._memoTimer = setTimeout(() => {
    const now = new Date();
    const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    // カテゴリを取得
    const lesson_obj = state.lessons.find(l => l.course === course && l.lesson === lesson);
    const category = lesson_obj ? (lesson_obj.category || 'ServiceNow CIS-DF') : 'ServiceNow CIS-DF';
    sendToSheet('saveMemo', {
      category,
      course,
      lesson,
      qno: `Q${parseInt(qi)+1}`,
      text,
      date: dateStr
    });
  }, 1500);
}

function getComment(lid, qi) {
  const newKey = lid + '_' + qi;
  if (state.comments && state.comments[newKey] !== undefined) return state.comments[newKey];
  // 旧キー互換: lid_0_qi, lid_1_qi など
  if (state.comments) {
    for (let i = 0; i < 100; i++) {
      const oldKey = lid + '_' + i + '_' + qi;
      if (state.comments[oldKey] !== undefined) {
        // 旧キーを新キーに移行
        state.comments[newKey] = state.comments[oldKey];
        delete state.comments[oldKey];
        save();
        return state.comments[newKey];
      }
    }
  }
  return '';
}
function saveComment(lid, qi, text) {
  if (!state.comments) state.comments = {};
  state.comments[lid+'_'+qi] = text;
  save();
}

// ── Quiz field normalizer ────────────────────────────────
function normalizeQuiz(quiz) {
  if (!Array.isArray(quiz)) return [];
  return quiz.map(q => ({
    type: q.type || q.t || '基礎',
    q: q.q,
    img: q.img || q.i || '',  // 問題文に添付する画像（表・図など）のURL
    opts: q.opts || q.o || [],
    ans: q.ans !== undefined ? q.ans : (q.a !== undefined ? q.a : 0),
    multi: q.multi || null,  // 複数選択の正解インデックス配列 例: [1,3]
    exp: q.exp || q.e || ''
  }));
}

// ── Utils ──────────────────────────────────────────────
function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 問題文に添付された画像（表・図など）の描画 ──────────
function renderQuestionImage(img) {
  if (!img) return '';
  const url = escHtml(img);
  return `<a class="qimg-link" href="${url}" target="_blank" rel="noopener">
    <img class="qimg" src="${url}" alt="問題の図・表" loading="lazy" onerror="this.closest('.qimg-link').classList.add('qimg-error')">
  </a>`;
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#21262d;border:1px solid #58a6ff;color:#e6edf3;padding:10px 18px;border-radius:8px;font-size:13px;z-index:300;animation:fadeIn .2s;';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ── GitHub管理JSON(data/lessons.json)から問題データ・メモを読み込み ─────
// スプレッドシート(GAS)管理は廃止し、リポジトリ内のJSONを正とする。
// 進捗データ(quizState/history/errors)はlocalStorageのみで管理し、ここでは一切上書きしない。
async function loadLessonsFromGithub() {
  try {
    const res = await fetch('data/lessons.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const lessons = json.lessons || [];
    if (lessons.length === 0) return;

    // IDを付与してstate.lessonsに反映(normalizeQuizでフィールド名を統一)
    state.lessons = lessons.map(l => ({
      ...l,
      id: l.id || (l.course.replace(/\s/g,'') + '_' + l.lesson.replace(/\./g,'')),
      category: l.category || 'ServiceNow CIS-DF',
      quiz: normalizeQuiz(l.quiz || [])
    }));

    // メモ(comments)はローカルの編集を優先し、未設定分のみJSON側で補完
    if (json.comments) {
      Object.keys(json.comments).forEach(k => {
        if (!(k in state.comments)) state.comments[k] = json.comments[k];
      });
    }

    // errors の初期化(新規レッスンのみ)
    state.lessons.forEach(l => {
      if (!state.errors[l.id]) state.errors[l.id] = new Set();
      const cat = l.category || 'ServiceNow CIS-DF';
      if (!CATEGORIES[cat]) {
        CATEGORIES[cat] = { icon: '📚', desc: '', color: '#e67e22' };
      }
    });

    save();

    // ホーム画面更新
    renderHomeScreen();
    if (state.currentCategory) {
      renderSidebar();
      renderContent();
    }
  } catch (err) {
    console.error('問題データ読込エラー(GitHub JSON):', err);
    // 取得に失敗した場合はlocalStorageのキャッシュデータをそのまま使用
    if (state.lessons.length > 0) {
      renderHomeScreen();
      if (state.currentCategory) {
        renderSidebar();
        renderContent();
      }
    }
  }
}

// ── Init ───────────────────────────────────────────────
load();

// 起動時は必ずホーム画面を表示する
</script>
